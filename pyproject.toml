[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "joy"
version = "0.1.0"
description = "Joy — 看屏副驾：国内主流识图 API + 聊天回复辅助（发送永远手动）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Joy contributors" }]
keywords = ["vision", "ocr", "wechat", "copilot", "llm", "privacy"]
dependencies = [
  "openai>=1.40",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "Pillow>=10.0",
  "numpy>=1.26",
  "pywin32>=306; platform_system=='Windows'",
  "mss>=9.0",
  "rapidocr-onnxruntime>=1.3",
  "opencv-python-headless>=4.8,<4.11",
]

[project.optional-dependencies]
ui = ["PySide6>=6.6"]
dev = ["pytest>=8.0", "ruff>=0.5"]
all = ["joy[ui,dev]"]

[project.scripts]
joy = "joy.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
