# Joy 下载站 — Nginx 示例（Ubuntu / Debian）
# 用法：复制到 /etc/nginx/sites-available/joy-download
# 然后改 server_name、root，再 ln -s 到 sites-enabled 并 reload

server {
    listen 80;
    server_name download.example.com;   # ← 改成你的域名或服务器 IP

    root /var/www/joy-download;         # ← 站点根目录（本目录内容）
    index index.html;

    # 下载页
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 更新清单：禁止浏览器长时间缓存
    location = /api/latest.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # 安装包：支持断点续传，缓存短一点方便换包
    location /releases/ {
        add_header Cache-Control "public, max-age=300";
        add_header Accept-Ranges bytes;
        types { application/octet-stream exe; }
        default_type application/octet-stream;
    }

    # 不列目录
    autoindex off;
    client_max_body_size 200m;
}

# 建议上 HTTPS（certbot）：
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d download.example.com
